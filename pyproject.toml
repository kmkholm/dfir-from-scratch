[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfir-from-scratch"
version = "0.1.0"
description = "A hands-on digital forensics and incident response course that generates its own evidence. No GPU, no API key, no network."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dr. Mohammed Tawfik", email = "kmkhol01@gmail.com" }]
keywords = [
    "dfir", "digital-forensics", "incident-response", "cybersecurity",
    "forensics", "ctf", "security-education", "blue-team", "agent-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pillow>=9"]

[project.urls]
Homepage = "https://github.com/kmkholm/dfir-from-scratch"
Issues = "https://github.com/kmkholm/dfir-from-scratch/issues"

[project.scripts]
dfir = "dfir.cli:main"

[tool.setuptools]
packages = ["dfir", "dfir.chapters"]

[tool.setuptools.package-data]
dfir = ["_samples.py"]
